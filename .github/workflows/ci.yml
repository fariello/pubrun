name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          # ubuntu-latest (Ubuntu 26.04) no longer ships Python 3.8/3.9 builds.
          - os: ubuntu-latest
            python-version: "3.8"
          - os: ubuntu-latest
            python-version: "3.9"
        include:
          - os: ubuntu-24.04
            python-version: "3.8"
          - os: ubuntu-24.04
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install -e ".[dev,tui]"
      - name: Run tests
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12') }}
        run: pytest tests/ -v -p randomly
      - name: Run tests with coverage gate
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        run: pytest tests/ -v -p randomly --cov=src --cov-report=term-missing --cov-fail-under=78

  extra-suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev,bench]" pyyaml
      - name: Run script and benchmark contract tests
        run: pytest .github/scripts/ benchmarks/test_*.py tests/test_compatibility.py -v -p randomly
      - name: Smoke test benchmarks/plot.py with headless matplotlib
        run: |
          python benchmarks/plot.py --help
          python -c "import matplotlib; matplotlib.use('Agg'); import matplotlib.pyplot"

  no-tui:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package without tui extra
        run: pip install -e ".[dev]"
      - name: Verify conditional tomli dependency on Python <3.11
        if: ${{ matrix.python-version == '3.10' }}
        run: python -c "import tomli"
      - name: Run tests
        run: pytest tests/ -v -p randomly

  packaging:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build frontend
        run: pip install build twine
      - name: Build sdist and wheel
        run: python -m build --outdir dist .
      - name: Check distribution metadata with twine
        run: twine check --strict dist/*
      - name: Verify sdist cleanliness, wheel contents, and commit stamp in clean environments
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="$(git rev-parse HEAD | tr -d '\r')"
          WORK_DIR="$(mktemp -d)"
          trap 'rm -rf "$WORK_DIR"' EXIT

          DIRECT_WHL="$(ls dist/*.whl)"
          SDIST_TAR="$(ls dist/*.tar.gz)"

          SDIST_LISTING="$(tar -tzf "$SDIST_TAR")"
          for forbidden in "/.aw/" "/.agents/" "/.claude/" "/.opencode/" "/AGENTS.md" "/TODO.md"; do
            if grep -Fq "$forbidden" <<< "$SDIST_LISTING"; then
              echo "Forbidden internal path '$forbidden' found in $SDIST_TAR" >&2
              exit 1
            fi
          done

          mkdir -p "$WORK_DIR/sdist-unpack" "$WORK_DIR/sdist-dist"
          tar -xzf "$SDIST_TAR" -C "$WORK_DIR/sdist-unpack"
          SDIST_SRC="$(find "$WORK_DIR/sdist-unpack" -mindepth 1 -maxdepth 1 -type d)"
          python -m build --wheel --outdir "$WORK_DIR/sdist-dist" "$SDIST_SRC"
          SDIST_WHL="$(ls "$WORK_DIR/sdist-dist"/*.whl)"

          check_wheel() {
            local label="$1"
            local whl="$2"
            local venv_dir="$WORK_DIR/venv-$label"
            local bench_cwd="$WORK_DIR/bench-cwd-$label"
            local listing
            listing="$(python -m zipfile -l "$whl")"
            echo "=== zipfile listing ($label) ==="
            echo "$listing"
            for required in \
              "pubrun/_build_meta.json" \
              "pubrun/COMMIT" \
              "pubrun/py.typed" \
              "pubrun/resources/default.toml" \
              "licenses/LICENSE" \
              "licenses/NOTICE" \
              "pubrun/_bench/__init__.py" \
              "pubrun/_bench/harness.py" \
              "pubrun/_bench/scenarios.py" \
              "pubrun/_bench/share_safety.py" \
              "pubrun/_bench/workloads/__init__.py" \
              "pubrun/_bench/workloads/noop.py" \
              "pubrun/_bench/workloads/cpu_burn.py" \
              "pubrun/_bench/workloads/file_read.py" \
              "pubrun/_bench/workloads/io_sink.py" \
              "pubrun/_bench/workloads/print_loop.py" \
              "pubrun/_bench/scripts/__init__.py" \
              "pubrun/_bench/scripts/run_bench.sbatch" \
              "pubrun/_bench/scripts/submit_bench.sh" \
              "pubrun/_bench/scripts/submit_bench_pbs.sh" \
              "pubrun/_bench/scripts/submit_bench_lsf.sh" \
              "pubrun/_bench/scripts/submit_bench_sge.sh"; do
              if ! grep -Fq "$required" <<< "$listing"; then
                echo "Missing $required in $whl" >&2
                exit 1
              fi
            done
            for forbidden in \
              "benchmarks/results/" \
              "benchmarks/data/" \
              ".aw/" \
              "plot.py" \
              "aggregate.py" \
              "pull_submissions.py" \
              "startup_breakdown.py" \
              "package_capture_bench.py" \
              "scaling_bench.py" \
              "test_benchmarks.py" \
              "test_share_safety.py"; do
              if grep -Fq "$forbidden" <<< "$listing"; then
                echo "Forbidden path '$forbidden' found in $whl" >&2
                exit 1
              fi
            done

            python -m venv "$venv_dir"
            local venv_bin
            if [ -d "$venv_dir/Scripts" ]; then
              venv_bin="$venv_dir/Scripts"
            else
              venv_bin="$venv_dir/bin"
            fi
            "$venv_bin/pip" install --no-deps --quiet "$whl"

            (
              cd "$WORK_DIR"
              local py_commit
              py_commit="$("$venv_bin/python" -c 'import pubrun; print(pubrun.__commit__)' | tr -d '\r')"
              echo "[$label] pubrun.__commit__=$py_commit"
              if [ "$py_commit" != "$EXPECTED_SHA" ]; then
                echo "Expected pubrun.__commit__=$EXPECTED_SHA, got $py_commit" >&2
                exit 1
              fi
              for cli in pubrun pbr; do
                local first_line
                first_line="$("$venv_bin/$cli" --version | head -n 1 | tr -d '\r')"
                echo "[$label] $cli --version: $first_line"
                if [[ "$first_line" != *"(commit $EXPECTED_SHA)"* ]]; then
                  echo "Expected '(commit $EXPECTED_SHA)' in $cli --version line: $first_line" >&2
                  exit 1
                fi
              done
            )

            mkdir -p "$bench_cwd"
            (
              cd "$bench_cwd"
              unset PYTHONPATH
              while IFS= read -r env_name; do
                [ -n "$env_name" ] && unset "$env_name"
              done < <(compgen -e PUBRUN_ || true)
              "$venv_bin/pubrun" bench --iterations 1 --passes 1 --no-baseline --local --no-submit < /dev/null
              if [ -e "$bench_cwd/runs" ]; then
                echo "[$label] Unexpected runs/ directory created in $bench_cwd" >&2
                exit 1
              fi
              shopt -s nullglob
              results=("$bench_cwd/pubrun-bench-results"/*.redacted.json)
              if [ "${#results[@]}" -ne 1 ]; then
                echo "[$label] Expected exactly 1 redacted result under $bench_cwd/pubrun-bench-results, found ${#results[@]}" >&2
                exit 1
              fi
              "$venv_bin/python" -c 'import sys; from pathlib import Path; import pubrun.minimal; from pubrun._bench.share_safety import check_share_safe_text; ok, reasons = check_share_safe_text(Path(sys.argv[1]).read_text(encoding="utf-8")); assert ok and not reasons, reasons; print("verified share-safe:", Path(sys.argv[1]).name)' "${results[0]}"
            )
          }

          check_wheel "direct" "$DIRECT_WHL"
          check_wheel "from-sdist" "$SDIST_WHL"

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package with dev and tui extras
        run: pip install -e ".[dev,tui]"
      - name: Print mypy version
        run: mypy --version
      - name: Run mypy
        run: mypy
      - name: Type-check (Windows platform)
        run: mypy --platform win32
      - name: Type-check (macOS platform)
        run: mypy --platform darwin
      - name: Type-check downstream PEP 561 mode submodules (--strict --no-implicit-reexport)
        run: >-
          MYPYPATH=src python -m mypy --config-file /dev/null --strict --no-implicit-reexport --follow-imports=silent -c
          "from typing import Optional; import pubrun.auto, pubrun.full, pubrun.noauto, pubrun.nopatch, pubrun.noconsole, pubrun.minimal; v1: str = pubrun.auto.__version__; c1: Optional[str] = pubrun.auto.__commit__; v2: str = pubrun.full.__version__; c2: Optional[str] = pubrun.full.__commit__; v3: str = pubrun.noauto.__version__; c3: Optional[str] = pubrun.noauto.__commit__; v4: str = pubrun.nopatch.__version__; c4: Optional[str] = pubrun.nopatch.__commit__; v5: str = pubrun.noconsole.__version__; c5: Optional[str] = pubrun.noconsole.__commit__; v6: str = pubrun.minimal.__version__; c6: Optional[str] = pubrun.minimal.__commit__; pubrun.noauto.start(); pubrun.noauto.stop()"
