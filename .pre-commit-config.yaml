repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: end-of-file-fixer
        exclude: ^benchmarks/data/accepted/
      - id: trailing-whitespace
        exclude: ^benchmarks/data/accepted/
      - id: check-yaml
      - id: check-toml

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Local hygiene guard: block absolute home paths / hostname (and, if enabled in
  # .sanitize-local.toml, IPs) from being committed. Runs after the fixers and gitleaks
  # so it sees the final staged bytes. See scripts/sanitize_paths.py and
  # .sanitize-local.toml.example. To auto-fix: python3 scripts/sanitize_paths.py --fix
  - repo: local
    hooks:
      - id: sanitize-paths
        name: sanitize home paths / hostname / IPs
        entry: python3 scripts/sanitize_paths.py --check
        language: system
        pass_filenames: true
        require_serial: true

      - id: check-local-leaks
        name: check local leaks (aw check-local-leaks --staged)
        entry: aw check-local-leaks --staged
        language: system
        pass_filenames: false
        require_serial: true

      # Retired post-commit cleanup no-op: hatch_build.py now stamps commit metadata
      # into wheel and sdist artifacts at build time without writing to the working tree.
      # Kept only so clones with an existing post-commit hook installation remove any
      # stale untracked src/pubrun/COMMIT file.
      - id: update-commit-file
        name: clean up stale src/pubrun/COMMIT (retired no-op)
        entry: python3 scripts/update_commit_file.py
        language: system
        stages: [post-commit]
        always_run: true
        pass_filenames: false
