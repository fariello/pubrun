[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pubrun"
version = "1.3.1"
description = "A lightweight Python library for capturing execution context."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Gabriele Fariello", email = "gfariello@fariel.com" }
]
requires-python = ">=3.8"
keywords = [
    "reproducibility",
    "provenance",
    "metadata",
    "telemetry",
    "research-software",
    "execution-tracking",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]
dependencies = [
    "tomli>=1.1.0; python_version < '3.11'"
]

[project.urls]
Homepage = "https://github.com/fariello/pubrun"
Repository = "https://github.com/fariello/pubrun"
Issues = "https://github.com/fariello/pubrun/issues"

[project.scripts]
pubrun = "pubrun.__main__:main"
pbr = "pubrun.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
    "pytest-cov",
    "tox>=4.0",
    "jsonschema>=4.0",
    "pytest-randomly>=3.0"
]
tui = [
    "textual>=0.80.0",
    "rich>=13.0.0"
]
bench = [
    "pytest-benchmark>=4.0",
    "matplotlib>=3.5"
]

[tool.hatch.build.targets.wheel]
packages = ["src/pubrun"]
exclude = ["src/pubrun/COMMIT", "src/pubrun/_build_meta.json"]

[tool.hatch.build.targets.sdist]
exclude = ["src/pubrun/COMMIT", "src/pubrun/_build_meta.json"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# `pytest-randomly` is a dev dependency for LOCAL adverse-order testing (opt in with `-p randomly`);
# it is deliberately DISABLED by default so CI and normal runs stay deterministic. Enabling
# randomized order in CI is a separate, later step (see the flaky-test-hardening IPD, OQ1=C):
# it would surface additional latent order-coupling that must be worked through first.
addopts = "-p no:randomly"
markers = [
    "slow: runs the benchmark harness or another multi-subprocess workload (deselect with -m 'not slow')",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
files = ["src/pubrun"]

[[tool.mypy.overrides]]
module = ["IPython", "IPython.*", "yappi", "tomli"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Legacy type-check ratchet: this list may only shrink, never grow.
# Remove each module as its existing errors are fixed (backlog item qqwebg).
module = [
    "pubrun.core",
    "pubrun.tracker",
]
ignore_errors = true
